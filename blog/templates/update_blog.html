{% extends "base.html" %}

{% block title %} Edit blog post {% endblock %}


{% block content%}

{% if user.is_authenticated %}
    <div class="container">
        <h1 style="color: black;">Update post</h1>
        <br/><br/>
        <div class="form-group">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-dark" type="submit">Update</button>
            </form>
        </div>
    </div>
{% endif %}

{% endblock %}
